name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Also test on macOS and Windows (automatic on public repos)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # fmt + clippy + tests + versions + nu tests —
  # the same script `just check-all` runs.
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # Generates the Lua module of uniffi's fixtures and the tour crate, builds it
  # for Lua 5.4 and LuaJIT (warnings are errors), loads it, and runs the Lua tests.
  lua:
    name: Lua (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fixtures/uniffi -> target
            fixtures/tour -> target
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install Lua and LuaJIT (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 liblua5.4-dev luajit libluajit-5.1-dev
      - name: Install Lua and LuaJIT (macOS)
        if: runner.os == 'macOS'
        run: brew install lua luajit
      - name: Tour end-to-end test
        run: nu scripts/ci/lua_e2e.nu
      - name: uniffi fixture suite
        run: nu scripts/ci/fixtures.nu

  # The binary ships for all three systems: paths, line endings and process
  # handling differ there.
  test:
    name: test (${{ matrix.os }})
    # A private repo pays 10x for macOS and 2x for Windows minutes: there this
    # runs only when dispatched with full_matrix.
    if: ${{ !github.event.repository.private || inputs.full_matrix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --all-features

  # The Linux release binaries are static musl ones (any distro); skipped when
  # scripts/project.nu sets LINUX to "gnu".
  musl:
    name: musl (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: Build, statically linked and runs
        run: nu scripts/ci/check_static.nu x86_64-unknown-linux-musl --build

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # @master + toolchain, not @1.90: Dependabot would bump a version ref.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: cargo check
        run: cargo check --workspace --locked
