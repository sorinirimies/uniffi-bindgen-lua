name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths: ["fuzz/**", "crates/**/src/**", "Cargo.lock", "scripts/ci/fuzz_lua.nu"]
  pull_request:
    paths: ["fuzz/**", "crates/**/src/**", "Cargo.lock", "scripts/ci/fuzz_lua.nu"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: Fuzz each target for 60s
        run: nu scripts/ci/fuzz_all.nu --secs 60
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  fuzz-lua:
    name: generated Lua converters (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fixtures/tour -> target
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 liblua5.4-dev
      - name: Fuzz the generated converters for 60s
        run: nu scripts/ci/fuzz_lua.nu --secs 60
